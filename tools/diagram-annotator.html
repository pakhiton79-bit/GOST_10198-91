<title>Разметчик чертежей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#EEF0F2;
    --surface:#FFFFFF;
    --surface-2:#E6E9EC;
    --surface-3:#DCE0E4;
    --ink:#1B2024;
    --ink-muted:#5C6670;
    --ink-faint:#889199;
    --line:#D2D7DC;
    --line-strong:#B9C0C6;
    --accent:#8A4B26;
    --accent-strong:#6E3C1E;
    --accent-soft:#F2E5D9;
    --accent-contrast:#FFFFFF;
    --danger:#C43B3B;
    --danger-soft:#F6DEDD;
    --grid-dot: rgba(27,32,36,0.10);
    --shadow: 0 1px 2px rgba(20,24,28,.06), 0 8px 24px -12px rgba(20,24,28,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#14171A;
      --surface:#1B1F23;
      --surface-2:#20252A;
      --surface-3:#282E34;
      --ink:#E7E9EC;
      --ink-muted:#96A0AA;
      --ink-faint:#6B7580;
      --line:#2C3238;
      --line-strong:#3A4148;
      --accent:#CB8657;
      --accent-strong:#E3A176;
      --accent-soft:#3A2A1E;
      --accent-contrast:#161311;
      --danger:#E0685F;
      --danger-soft:#3A2323;
      --grid-dot: rgba(231,233,236,0.07);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ground:#14171A; --surface:#1B1F23; --surface-2:#20252A; --surface-3:#282E34;
    --ink:#E7E9EC; --ink-muted:#96A0AA; --ink-faint:#6B7580;
    --line:#2C3238; --line-strong:#3A4148;
    --accent:#CB8657; --accent-strong:#E3A176; --accent-soft:#3A2A1E; --accent-contrast:#161311;
    --danger:#E0685F; --danger-soft:#3A2323;
    --grid-dot: rgba(231,233,236,0.07);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    font-size:14px; line-height:1.45;
  }
  ::selection{ background:var(--accent-soft); }
  button{ font-family:inherit; }
  input, select, textarea{ font-family:inherit; color:inherit; }
  .mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:560px; }

  /* ---------- header ---------- */
  .topbar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ font-size:20px; line-height:1; }
  .brand-name{ font-weight:800; font-size:16px; letter-spacing:.2px; }
  .brand-sub{ color:var(--ink-muted); font-size:12.5px; margin-left:10px; padding-left:10px; border-left:1px solid var(--line); }
  .photo-controls{ display:flex; align-items:center; gap:10px; }
  .photo-meta{ color:var(--ink-muted); font-size:12.5px; }

  .btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--surface);
    color:var(--ink); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600;
    cursor:pointer; transition:background .12s ease, border-color .12s ease, transform .06s ease;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn-accent:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:6px; }
  .btn-danger{ color:var(--danger); border-color:var(--danger-soft); }
  .btn-danger:hover{ background:var(--danger-soft); }
  .btn-icon{ padding:5px 7px; }

  /* ---------- workspace ---------- */
  .workspace{ flex:1 1 auto; display:flex; min-height:0; }

  .stage-viewport{
    flex:1 1 auto; overflow:auto; position:relative;
    background:
      radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0/22px 22px,
      var(--ground);
  }
  .stage{ position:relative; }
  .stage.tool-armed{ cursor:crosshair; }
  .stage-image{ position:absolute; display:block; user-select:none; -webkit-user-drag:none; box-shadow:var(--shadow); }
  .svg-layer{ position:absolute; left:0; top:0; pointer-events:none; }
  .svg-layer .hitline{ pointer-events:none; }
  .shape-line{ stroke:var(--accent); stroke-width:3; fill:none; }
  .shape-line.ghost{ stroke:var(--ink-faint); stroke-dasharray:6 5; stroke-width:2; }
  .arrow-marker-path{ fill:var(--accent); }

  .handle{
    position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px;
    border-radius:50%; background:var(--surface); border:2.5px solid var(--accent);
    cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .handle:active{ cursor:grabbing; }
  .handle:hover{ background:var(--accent-soft); }

  .label-badge{
    position:absolute; transform:translate(-50%,-50%);
    background:var(--surface); border:1.5px solid var(--accent);
    color:var(--accent-strong); border-radius:999px; padding:2px 10px;
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    white-space:nowrap; cursor:grab; box-shadow:var(--shadow); user-select:none;
    max-width:260px; overflow:hidden; text-overflow:ellipsis;
  }
  .label-badge:active{ cursor:grabbing; }
  .label-badge.vertical{ writing-mode:vertical-rl; transform:translate(-50%,-50%) rotate(180deg); }

  .marker-point{
    position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background:var(--ink-faint); pointer-events:none;
  }

  /* ---------- inspector sidebar ---------- */
  .inspector{
    flex:0 0 340px; display:flex; flex-direction:column; min-height:0;
    background:var(--surface); border-left:1px solid var(--line);
  }
  .panel{ padding:14px 16px; border-bottom:1px solid var(--line); }
  .panel-title{ font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-muted); margin-bottom:10px; }
  .panel-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .panel-title-row .panel-title{ margin-bottom:0; }

  .tool-buttons{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .tool-btn{
    appearance:none; border:1.5px solid var(--line-strong); background:var(--surface-2);
    color:var(--ink); border-radius:8px; padding:9px 4px; font-size:12px; font-weight:700;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tool-btn .glyph{ font-size:16px; font-family:'JetBrains Mono',monospace; }
  .tool-btn:hover{ background:var(--surface-3); }
  .tool-btn.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }

  .zoom-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .zoom-row label{ font-size:12px; color:var(--ink-muted); flex:0 0 auto; }
  .zoom-row input[type=range]{ flex:1 1 auto; accent-color:var(--accent); }
  .zoom-row .mono{ font-size:12px; color:var(--ink-muted); width:34px; text-align:right; }

  .hint{ margin-top:10px; font-size:12px; color:var(--ink-muted); line-height:1.5; }
  kbd{
    font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--surface-2);
    border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:1px 5px;
  }

  .list-panel{ flex:1 1 auto; overflow-y:auto; min-height:80px; }
  .shape-list{ display:flex; flex-direction:column; gap:8px; }
  .empty-list{ color:var(--ink-faint); font-size:12.5px; padding:6px 2px; }

  .shape-row{ border:1px solid var(--line); border-radius:9px; padding:8px; background:var(--surface-2); }
  .shape-row-top{ display:flex; align-items:center; gap:6px; }
  .shape-index{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); width:16px; flex:0 0 auto; }
  .type-select{
    flex:0 0 auto; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    border-radius:6px; padding:4px 6px; font-size:12px; font-weight:600;
  }
  .coord-fields{ display:flex; align-items:center; gap:3px; flex:1 1 auto; min-width:0; }
  .coord-fields input{
    width:46px; border:1px solid var(--line-strong); background:var(--surface); border-radius:5px;
    padding:4px 2px; font-size:11px; text-align:center;
    -moz-appearance:textfield;
  }
  .coord-fields input::-webkit-outer-spin-button,
  .coord-fields input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .coord-fields input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .coord-arrow{ color:var(--ink-faint); font-size:11px; }
  .row-actions{ display:flex; gap:3px; flex:0 0 auto; }

  .label-row{ display:flex; align-items:center; gap:6px; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line); }
  .label-row input[type=text]{
    flex:1 1 auto; min-width:0; border:1px solid var(--line-strong); background:var(--surface);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .label-row input[type=text]:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .vert-toggle{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-muted); flex:0 0 auto; white-space:nowrap; }
  .add-label-link{
    background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer;
    padding:5px 2px 0; margin-top:2px;
  }
  .add-label-link:hover{ text-decoration:underline; }

  .code-panel{ flex:0 0 auto; max-height:38%; display:flex; flex-direction:column; border-bottom:none; }
  .dims-readout{ font-size:11.5px; color:var(--ink-muted); margin-bottom:8px; }
  .code-panel textarea{
    flex:1 1 auto; min-height:120px; resize:vertical; border:1px solid var(--line-strong);
    background:var(--ground); color:var(--ink); border-radius:8px; padding:10px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.55;
  }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--ground); padding:8px 16px; border-radius:8px;
    font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
    box-shadow:var(--shadow); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .btn, .toast{ transition:none; }
  }

  @media (max-width: 860px){
    .workspace{ flex-direction:column; }
    .inspector{ flex:1 1 auto; border-left:none; border-top:1px solid var(--line); }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">📐</span>
      <span class="brand-name">Разметчик чертежей</span>
      <span class="brand-sub">линии, стрелки и подписи в натуральных пикселях фото</span>
    </div>
    <div class="photo-controls">
      <span class="photo-meta mono" id="photoMeta"></span>
      <button class="btn btn-ghost" id="btnNewPhoto">Новое фото</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
  </header>

  <main class="workspace">
    <section class="stage-viewport" id="stageViewport">
      <div class="stage" id="stage">
        <img class="stage-image" id="stageImage" alt="" draggable="false">
        <svg class="svg-layer" id="svgLayer">
          <defs>
            <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path class="arrow-marker-path" d="M0,0 L10,5 L0,10 z"></path>
            </marker>
          </defs>
        </svg>
        <div id="handlesLayer"></div>
        <div id="labelsLayer"></div>
      </div>
    </section>

    <aside class="inspector">
      <div class="panel toolbar-panel">
        <div class="panel-title">Инструмент рисования</div>
        <div class="tool-buttons">
          <button class="tool-btn" data-tool="line" title="Линия без стрелки"><span class="glyph">──</span>линия</button>
          <button class="tool-btn" data-tool="single" title="Стрелка в одну сторону"><span class="glyph">──▶</span>стрелка</button>
          <button class="tool-btn active" data-tool="double" title="Стрелка в обе стороны"><span class="glyph">◀─▶</span>размер</button>
        </div>
        <div class="zoom-row">
          <label for="zoomRange">Масштаб</label>
          <input type="range" id="zoomRange" min="30" max="150" value="70" step="5">
          <span class="mono" id="zoomLabel">70%</span>
        </div>
        <div class="hint">Клик по фото — первая точка, ещё клик — вторая. <kbd>Esc</kbd> отменяет текущую линию. Кружки на концах и подписи можно перетаскивать мышью — подпись можно тащить и за край фото.</div>
      </div>

      <div class="panel list-panel">
        <div class="panel-title-row">
          <div class="panel-title">Элементы (<span id="shapeCount">0</span>)</div>
          <button class="btn btn-ghost btn-sm btn-danger" id="btnClearAll">Очистить все</button>
        </div>
        <div class="shape-list" id="shapeList"></div>
      </div>

      <div class="panel code-panel">
        <div class="panel-title-row">
          <div class="panel-title">Готовый код</div>
          <button class="btn btn-accent btn-sm" id="btnCopy">Скопировать</button>
        </div>
        <div class="dims-readout mono" id="dimsReadout"></div>
        <textarea id="codeOutput" readonly spellcheck="false"></textarea>
      </div>
    </aside>
  </main>
</div>

<div class="toast" id="toast"></div>

    el.handlesLayer.innerHTML = "";
    shapes.forEach(function(s){
      el.handlesLayer.appendChild(makeHandle(s.id, "p1", s.x1, s.y1));
      el.handlesLayer.appendChild(makeHandle(s.id, "p2", s.x2, s.y2));
    });
  }
  function makeHandle(shapeId, which, nx, ny){
    var p = toStagePx(nx, ny);
    var d = document.createElement("div");
    d.className = "handle";
    d.style.left = p.x + "px"; d.style.top = p.y + "px";
    d.dataset.shapeId = shapeId; d.dataset.which = which;
    d.title = which === "p1" ? "Начало (x1,y1)" : "Конец (x2,y2)";
    d.addEventListener("pointerdown", onHandlePointerDown);
    return d;
  }

  function renderLabels(){
    el.labelsLayer.innerHTML = "";
    shapes.forEach(function(s){
      if (!s.label) return;
      var p = toStagePx(s.label.lx, s.label.ly);
      var d = document.createElement("div");
      d.className = "label-badge" + (s.label.vertical ? " vertical" : "");
      d.style.left = p.x + "px"; d.style.top = p.y + "px";
      d.textContent = s.label.text || "(пусто)";
      d.dataset.shapeId = s.id;
      d.addEventListener("pointerdown", onLabelPointerDown);
      el.labelsLayer.appendChild(d);
    });
  }

  function typeGlyph(t){ return t === "line" ? "—" : (t === "single" ? "→" : "↔"); }

  function renderList(){
    el.shapeCount.textContent = shapes.length;
    el.shapeList.innerHTML = "";
    if (!shapes.length) {
      el.shapeList.innerHTML = '<div class="empty-list">Пока пусто — выберите инструмент слева и кликните по фото дважды: первая точка, вторая точка.</div>';
      return;
    }
    shapes.forEach(function(s, i){
      var row = document.createElement("div");
      row.className = "shape-row";

      var top = document.createElement("div");
      top.className = "shape-row-top";

      var idx = document.createElement("span");
      idx.className = "shape-index mono";
      idx.textContent = (i+1) + ".";
      top.appendChild(idx);

      var sel = document.createElement("select");
      sel.className = "type-select";
      [["line","линия"],["single","стрелка →"],["double","стрелка ↔"]].forEach(function(o){
        var opt = document.createElement("option");
        opt.value = o[0]; opt.textContent = o[1];
        if (s.type === o[0]) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", function(){ s.type = sel.value; render(); });
      top.appendChild(sel);

      var coords = document.createElement("div");
      coords.className = "coord-fields";
      coords.appendChild(coordInput(s, "x1"));
      coords.appendChild(coordInput(s, "y1"));
      var arrow = document.createElement("span");
      arrow.className = "coord-arrow"; arrow.textContent = "→";
      coords.appendChild(arrow);
      coords.appendChild(coordInput(s, "x2"));
      coords.appendChild(coordInput(s, "y2"));
      top.appendChild(coords);

      var actions = document.createElement("div");
      actions.className = "row-actions";
      var del = document.createElement("button");
      del.className = "btn btn-ghost btn-icon btn-danger btn-sm";
      del.textContent = "✕";
      del.title = "Удалить";
      del.addEventListener("click", function(){ shapes = shapes.filter(function(x){ return x.id !== s.id; }); render(); });
      actions.appendChild(del);
      top.appendChild(actions);

      row.appendChild(top);

      if (s.label) {
        var lrow = document.createElement("div");
        lrow.className = "label-row";
        var txt = document.createElement("input");
        txt.type = "text"; txt.value = s.label.text; txt.placeholder = "текст подписи";
        txt.addEventListener("input", function(){ s.label.text = txt.value; render(); });
        lrow.appendChild(txt);

        var vlabel = document.createElement("label");
        vlabel.className = "vert-toggle";
        var vcb = document.createElement("input");
        vcb.type = "checkbox"; vcb.checked = !!s.label.vertical;
        vcb.addEventListener("change", function(){ s.label.vertical = vcb.checked; render(); });
        vlabel.appendChild(vcb);
        vlabel.appendChild(document.createTextNode("верт."));
        lrow.appendChild(vlabel);

        var rm = document.createElement("button");
        rm.className = "btn btn-ghost btn-icon btn-sm";
        rm.textContent = "✕"; rm.title = "Убрать подпись";
        rm.addEventListener("click", function(){ s.label = null; render(); });
        lrow.appendChild(rm);

        row.appendChild(lrow);
      } else {
        var addLink = document.createElement("button");
        addLink.className = "add-label-link";
        addLink.textContent = "+ подпись";
        addLink.addEventListener("click", function(){
          s.label = {
            lx: Math.round((s.x1+s.x2)/2), ly: Math.round((s.y1+s.y2)/2),
            text: "", vertical: false
          };
          render();
          var input = row.querySelector(".label-row input[type=text]");
          if (input) input.focus();
        });
        row.appendChild(addLink);
      }

      el.shapeList.appendChild(row);
    });
  }

  function coordInput(s, key){
    var inp = document.createElement("input");
    inp.type = "number"; inp.value = s[key]; inp.className = "mono";
    inp.addEventListener("change", function(){
      var v = parseInt(inp.value, 10);
      if (!isNaN(v)) s[key] = v;
      render();
    });
    return inp;
  }

  function escText(t){ return String(t).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

  function shapeToCode(s){
    var parts = ["type:'"+s.type+"'", "x1:"+s.x1, "y1:"+s.y1, "x2:"+s.x2, "y2:"+s.y2];
    if (s.label) {
      parts.push("lx:"+s.label.lx, "ly:"+s.label.ly, "text:'"+escText(s.label.text)+"'");
      if (s.label.vertical) parts.push("vertical:true");
    }
    return "{" + parts.join(", ") + "}";
  }

  function renderCode(){
    el.dimsReadout.textContent = (IW && IH) ? ("Фото (натуральный размер): IW=" + IW + ", IH=" + IH) : "Фото не загружено";
    if (!shapes.length) { el.codeOutput.value = "[]"; return; }
    el.codeOutput.value = "[\n  " + shapes.map(shapeToCode).join(",\n  ") + "\n]";
  }

  // ---------- pointer interactions ----------
  el.stage.addEventListener("pointerdown", function(ev){
    if (ev.target !== el.stage && ev.target !== el.stageImage && ev.target !== el.svgLayer) return;
    if (!IW) return;
    var n = toNatural(ev.clientX, ev.clientY);
    if (!drawPending) {
      drawPending = { x1: n.x, y1: n.y };
      render();
    } else {
      shapes.push({ id: uid(), type: currentTool, x1: drawPending.x1, y1: drawPending.y1, x2: n.x, y2: n.y, label: null });
      drawPending = null;
      render();
    }
  });

  el.stage.addEventListener("pointermove", function(ev){
    if (drawPending) {
      var n = toNatural(ev.clientX, ev.clientY);
      var p1 = toStagePx(drawPending.x1, drawPending.y1);
      var p2 = toStagePx(n.x, n.y);
      var ghost = document.getElementById("ghostLine");
      if (ghost) { ghost.setAttribute("x2", p2.x); ghost.setAttribute("y2", p2.y); }
    }
  });

  window.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && drawPending) { drawPending = null; render(); }
  });

  function onHandlePointerDown(ev){
    ev.stopPropagation();
    var shapeId = Number(ev.currentTarget.dataset.shapeId);
    var which = ev.currentTarget.dataset.which;
    dragInfo = { kind: which, shapeId: shapeId };
    ev.currentTarget.setPointerCapture(ev.pointerId);
  }
  function onLabelPointerDown(ev){
    ev.stopPropagation();
    var shapeId = Number(ev.currentTarget.dataset.shapeId);
    dragInfo = { kind: "label", shapeId: shapeId };
    ev.currentTarget.setPointerCapture(ev.pointerId);
  }
  window.addEventListener("pointermove", function(ev){
    if (!dragInfo) return;
    var s = shapes.filter(function(x){ return x.id === dragInfo.shapeId; })[0];
    if (!s) return;
    var n = toNatural(ev.clientX, ev.clientY);
    if (dragInfo.kind === "p1") { s.x1 = n.x; s.y1 = n.y; }
    else if (dragInfo.kind === "p2") { s.x2 = n.x; s.y2 = n.y; }
    else if (dragInfo.kind === "label" && s.label) { s.label.lx = n.x; s.label.ly = n.y; }
    render();
  });
  window.addEventListener("pointerup", function(){ dragInfo = null; });

  // ---------- toolbar ----------
  Array.prototype.forEach.call(document.querySelectorAll(".tool-btn"), function(btn){
    btn.addEventListener("click", function(){
      currentTool = btn.dataset.tool;
      Array.prototype.forEach.call(document.querySelectorAll(".tool-btn"), function(b){ b.classList.toggle("active", b === btn); });
    });
  });

  el.zoomRange.addEventListener("input", function(){
    scale = Number(el.zoomRange.value) / 100;
    el.zoomLabel.textContent = el.zoomRange.value + "%";
    layoutStage(); render();
  });

  // ---------- photo controls ----------
  el.btnNewPhoto.addEventListener("click", function(){
    if (shapes.length && !confirm("Загрузить новое фото? Текущая разметка (" + shapes.length + " элем.) будет очищена.")) return;
    el.fileInput.click();
  });
  el.fileInput.addEventListener("change", function(){
    var file = el.fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      var img = new Image();
      img.onload = function(){
        IW = img.naturalWidth; IH = img.naturalHeight;
        imageSrc = dataUrl;
        shapes = [];
        applyImage();
        render();
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
    el.fileInput.value = "";
  });

  el.btnClearAll.addEventListener("click", function(){
    if (!shapes.length) return;
    if (!confirm("Удалить все " + shapes.length + " элемент(ов) разметки?")) return;
    shapes = []; render();
  });

  el.btnCopy.addEventListener("click", function(){
    var text = el.codeOutput.value;
    function ok(){ showToast("Код скопирован"); }
    function fail(){
      el.codeOutput.select();
      try { document.execCommand("copy"); ok(); } catch(e){ showToast("Не удалось скопировать — выделите текст вручную"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fail);
    } else fail();
  });

  var toastTimer = null;
  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove("show"); }, 1600);
  }

  // ---------- persistence ----------
  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ IW:IW, IH:IH, imageSrc:imageSrc, shapes:shapes }));
      } catch(e){}
    }, 250);
  }
  function tryRestore(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !data.imageSrc || !data.IW) return false;
      IW = data.IW; IH = data.IH; imageSrc = data.imageSrc;
      shapes = (data.shapes || []).map(function(s){ s.id = uid(); return s; });
      applyImage();
      render();
      return true;
    } catch(e){ return false; }
  }

  el.stageImage.addEventListener("load", layoutStage);

  if (!tryRestore()) loadDemo();
})();
</script>
