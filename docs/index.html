       чекбоксы, hover-обводки, eyebrow). Более светлый --accent2 (Amber)
       использовался раньше для этих "остальных" случаев - полностью убран
       по замечанию пользователя ("снеси старый цвет полностью"), в разметке
       и в палитре больше не встречается. Тени убраны везде
       (--shadow-sm/--shadow-lg = none) - элевация через обводки-волоски и
       тонировку фона, не через box-shadow.
       Text/border palette (Midnight Ink/Slate/Frost Border) - как в самом
       референсе, без изменений (правки пользователя касались только фонов и
       синих акцентов, не текста/обводок). */
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --panel-hover: #FAF6EF;
    --table-header-bg: #F6F0E6;
    --ink: #091135;
    --ink-soft: #36394A;
    --rule: #E1E9F0;
    --border-input: #E1E9F0;
    --border-btn: #E1E9F0;
    --secondary-hover: #F6F0E6;
    --accent: #8A4B26;
    --accent-hover: #6E3B1C;
    --accent-wash: #F1E4D8;
    --ok: #2E7D32;
    --warn: #B7791F;
    --warn-wash: #FBF3E4;
    --error: #c23b2c;
    --shadow-sm: none;
    --shadow-lg: none;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:16px;
    letter-spacing:.015em;
    line-height:1.35;
    overflow-x:hidden;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}

  /* Навигация «Назад» / «Главная» - вверху страниц выбора ГОСТа/типа и самих
     калькуляторов (везде, кроме самой стартовой страницы - там некуда). */
  .top-nav{
    display:flex;
    gap:16px;
    margin-bottom:20px;
  }
  .top-nav a{
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .top-nav a:hover{color:var(--accent);}

  header{
    border-bottom:1px solid var(--rule);
    padding-bottom:20px;
    margin-bottom:32px;
  }
  .eyebrow{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-size:30px;
    margin:0 0 6px;
    color:var(--ink);
    font-weight:600;
  }
  .subtitle{
    font-size:14px;
    color:var(--ink-soft);
    font-family:inherit;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:32px;
    margin-bottom:24px;
    box-shadow:var(--shadow-sm);
  }
  .card h2{
    font-size:16px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink);
    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--rule);
  }

  .inputs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  /* "screen and" на всех адаптивных breakpoint'ах ниже (640/700/480px) -
     без него эти правила совпадали бы с теми же именами классов и внутри
     печатной области (#printArea .spec-row-diagram и т.п. используют те
     же общие имена классов, что и экранная вёрстка) - ширина печатного
     листа A4 (~733px по расчёту в common-print.js) достаточно близка к
     700px, и на части систем (другая трактовка @page margin/DPI при
     печати) реально может просесть ниже порога, из-за чего чертежи в
     печати непредсказуемо переключались на мобильную раскладку (в столбец,
     на всю ширину листа) - по репорту пользователя. */
  @media screen and (max-width:640px){
    .inputs{grid-template-columns:repeat(2,1fr);}
  }
  label{
    display:block;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type=number]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border-input);
    border-radius:8px;
    font-family:inherit;
    font-size:16px;
    background:#ffffff;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input[type=number]:focus{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-color:var(--accent);
  }
  select{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border-input);
    border-radius:8px;
    font-family:inherit;
    font-size:16px;
    background:#ffffff;
    color:var(--ink);
  }
  select:focus{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-color:var(--accent);
  }

  .comment-field{
    width:100%;
    min-height:110px;
    padding:14px 16px;
    border:1px solid var(--border-input);
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
    line-height:1.5;
    background:#ffffff;
    color:var(--ink);
    resize:vertical;
    box-sizing:border-box;
  }
  .comment-field:focus{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-color:var(--accent);
  }
  .comment-field::placeholder{
    color:var(--ink-soft);
  }

  button{
    margin-top:20px;
    background:var(--accent);
    color:#ffffff;
    border:none;
    padding:12px 24px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.015em;
    cursor:pointer;
    border-radius:8px;
    box-shadow:var(--shadow-sm);
    transition:background-color .15s ease;
  }
  button:hover{background:var(--accent-hover);}
  .action-card button:first-child{margin-top:0;}

  /* Secondary — второстепенные действия (см. design.md: белая, рамка, hover-фон) */
  .btn-secondary{
    background:#ffffff;
    color:var(--ink);
    border:1px solid var(--border-btn);
    box-shadow:none;
  }
  .btn-secondary:hover{background:var(--secondary-hover);}

  /* Обёртка вокруг трёх взаимоисключающих статусов расчёта (calcCheck/
     calcOutdated/calcError - JS переключает между ними класс .active, см.
     setCalcStatus() в common-print.js). Все три - в одной grid-ячейке
     (stacking) и visibility:hidden вместо display:none, когда не активны -
     в отличие от display:none, visibility:hidden всё равно занимает место
     в раскладке, поэтому ширина обёртки всегда равна ширине САМОГО
     широкого из трёх текстов, даже когда ни один не показан (до первого
     расчёта) - кнопка «Печать» не «прыгает» вправо после первого расчёта,
     то же расстояние зарезервировано с самого начала - по замечанию
     пользователя. */
  .calc-status{
    position:relative;
    display:inline-grid;
    margin-left:14px;
    vertical-align:middle;
  }
  .calc-status > span{
    grid-column:1;
    grid-row:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    visibility:hidden;
  }
  .calc-status > span.active{visibility:visible;}

  .calc-outdated{color:var(--warn);}
  .calc-check{color:var(--ok);}
  .calc-error{color:var(--error);}
  /* Значки статусов - SVG вместо символов Юникода (✓/⚠/✗): те менялись по
     начертанию от шрифта к шрифту и на Windows 7 частично не отображались
     (тофу-прямоугольники) - по отчёту пользователя. SVG рисуется одинаково
     везде и выглядит строже/единообразнее для всех трёх статусов сразу. */
  .calc-check .mark, .calc-outdated .mark, .calc-error .mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 20px;
    width:20px;height:20px;
    border-radius:50%;
    margin-right:6px;
  }
  .calc-check .mark{background:var(--ok);}
  .calc-outdated .mark{background:var(--warn);}
  .calc-error .mark{background:var(--error);}

  .print-btn{
    margin-top:20px;
    margin-left:12px;
    padding:12px 22px;
    font-size:13px;
  }
  /* Значки печати/PDF на кнопках - тоже SVG (тот же повод, что и .mark выше:
     эмодзи-принтер 🖨 и стрелка ⬇ не отображались на Windows 7). */
  .print-btn .btn-icon{
    vertical-align:-2px;
    margin-right:6px;
  }

  .summary-row{
    display:flex;
    gap:24px;
    align-items:center;
  }
  .summary-row .summary{flex:1;min-width:0;}
  .box-view{
    flex:0 0 280px;
    width:280px;
    height:auto;
    display:block;
    border:1px solid var(--rule);
    border-radius:12px;
    background:var(--panel);
    padding:12px;
    box-shadow:var(--shadow-sm);
  }
  @media screen and (max-width:700px){
    .summary-row{flex-direction:column;align-items:stretch;}
    .box-view{flex-basis:auto;width:100%;max-width:280px;margin:0 auto;}
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
    border-radius:12px;
    overflow:hidden;
  }
  .summary div{background:var(--panel);padding:18px 16px;overflow-wrap:break-word;}
  .summary .label{
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .summary .value{
    font-size:24px;
    font-weight:700;
    color:var(--ink);
    font-family:inherit;
  }
  .summary .value span{font-size:13px;font-weight:400;color:var(--ink-soft);}

  /* .summary-row переходит в столбец начиная с этой же ширины (см. блок
     выше) - плитки "Наружные размеры"/"Расход"/"Норма времени" получают
     втрое меньше места, чем рассчитано на 3-колоночный грид. Складываем
     плитки в один столбец сразу здесь, а не только на совсем узких
     экранах (<=480px) - иначе в диапазоне 480-700px длинные значения
     переносятся по цифрам ("1088" на "108"/"8"), хоть и без обрезки
     (minmax(0,1fr) выше уже не даёт им вылезать за пределы карточки). */
  @media screen and (max-width:700px){
    .summary{grid-template-columns:1fr;}
  }

  /* ============ Шестерёнка настроек нормы времени ============ */
  .time-tile{position:relative;}
  .time-settings-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:26px;
    height:26px;
    padding:0;
    margin:0;
    border:1px solid var(--rule);
    border-radius:8px;
    background:#ffffff;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Ховер - заливка var(--accent) + белая иконка, тот же приём, что и у
     основной кнопки/CTA (button{background:var(--accent);color:#fff})
     - по замечанию пользователя ("шестерёнка становится белой по версии
     нашего дизайна"), а не просто окрашенная обводка/иконка, как раньше. */
  .time-settings-btn:hover{background:var(--accent);border-color:var(--accent);color:#ffffff;}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(9,17,53,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-box{
    position:relative;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:var(--shadow-lg);
    padding:28px;
    max-width:380px;
    width:100%;
  }
  .modal-box h3{
    margin:0 0 20px;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    padding-right:24px;
  }
  /* Без hover-эффекта и transition (по замечанию пользователя) - крестик
     не меняет цвет и не анимируется при наведении. */
  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    width:28px;
    height:28px;
    padding:0;
    margin:0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:none;
  }
  /* .modal-close - это <button>, а у обычной кнопки есть общий button:hover
     {background:var(--accent-hover)} (тёмно-коричневая заливка CTA) - у него
     специфичность (element+pseudo-class) выше, чем у одного класса
     .modal-close, поэтому он перебивал transparent на hover. Явный hover
     здесь нужен не для эффекта, а чтобы погасить чужой. */
  .modal-close:hover{background:transparent;}
  .modal-field{margin-bottom:20px;}
  .modal-field:last-child{margin-bottom:0;}
  .modal-field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .modal-slider-row{display:flex;align-items:center;gap:14px;}
  .modal-slider-row input[type="number"]{
    width:64px;
    flex:0 0 auto;
    padding:6px 8px;
    border:1px solid var(--border-input);
    border-radius:6px;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
  }

  /* ============ "Прыгающий" ползунок с фиксированными остановками ============
     Свой виджет вместо нативного <input type=range> - см. createJumpSlider()
     в common-timesettings.js: нужно было и анимированное (CSS transition)
     перемещение между остановками, и круглые отметки на треке - ни то,
     ни другое нативный range с datalist не умеет (по замечанию пользователя:
     "ползунки должны двигаться прыжками, но плавно", "отметки... круговыми
     расширениями"). */
  .jump-slider{
    position:relative;
    flex:1;
    min-width:0;
    height:24px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
    outline:none;
  }
  .jump-slider:focus-visible .jump-slider-thumb{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .jump-slider-track{
    position:relative;
    width:100%;
    height:6px;
    background:var(--rule);
    border-radius:3px;
  }
  .jump-slider-fill{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    background:var(--accent);
    border-radius:3px;
    transition:width .18s ease;
  }
  .jump-slider-mark{
    position:absolute;
    top:50%;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--panel);
    border:2px solid var(--rule);
    transform:translate(-50%,-50%);
    transition:background-color .18s ease, border-color .18s ease;
  }
  .jump-slider-mark.passed{
    background:var(--accent);
    border-color:var(--accent);
  }
  .jump-slider-thumb{
    position:absolute;
    top:50%;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid var(--panel);
    transform:translate(-50%,-50%);
    transition:left .18s ease;
  }

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    margin-bottom:8px;
  }
  th:first-child, td:first-child{width:34%;}
  th:not(:first-child), td:not(:first-child){width:16.5%;}
  th,td{
    text-align:left;
    padding:9px 10px;
    font-family:inherit;
    font-size:14px;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
    border-bottom:1px solid var(--rule);
  }
  th{
    background:var(--table-header-bg);
    color:var(--ink-soft);
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.05em;
    font-weight:600;
  }
  th.num{text-align:right;}
  td.num{text-align:right;}
  /* Числовые ячейки (толщина/ширина/длина/кол-во) не переносим никогда - в
     отличие от названия детали (первая колонка), где перенос длинного
     названия на несколько строк - это нормально и ожидаемо, перенос ЧИСЛА
     выглядит как будто оно сломалось (см. мобильный фикс ниже - именно узкие
     числовые колонки на маленьких экранах были причиной). */
  th.num, td.num{white-space:nowrap;}
  tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;}

  .spec-table{margin-bottom:26px;}
  .spec-table:last-child{margin-bottom:0;}
  /* Скруглённые углы таблицы деталей - для единообразия с карточками и
     остальными блоками сайта (border-radius:12px, как у .card/.box-view) -
     по замечанию пользователя. Радиус и обводка - на обёртке (.spec-table
     div), а не на самой <table> (border-collapse:collapse ломает
     border-radius на table/th/td напрямую) - overflow:hidden обрезает
     прямые углы таблицы по скруглённой рамке обёртки. Только на экране -
     печатная таблица (#printArea .spec-table) не имеет своей рамки/радиуса,
     трогать её не нужно. */
  @media screen{
    .spec-table{
      border:1px solid var(--rule);
      border-radius:12px;
      overflow:hidden;
    }
  }
  .editable-cell{
    cursor:text;
    border-bottom:1px dashed var(--accent);
    border-radius:4px;
  }
  .editable-cell:hover{background:var(--accent-wash);}
  .editable-cell:focus{
    outline:none;
    background:var(--accent-wash);
    border-bottom:1px solid var(--accent);
  }

  .part-title{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin:22px 0 8px;
  }
  .part-title:first-child{margin-top:0;}

  .note{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--warn-wash);
    border-left:3px solid var(--warn);
    border-radius:0 10px 10px 0;
    padding:14px 16px;
    margin-top:20px;
    font-family:inherit;
    line-height:1.6;
  }

  .disclaimer{
    font-size:12px;
    color:var(--ink-soft);
    opacity:.75;
    font-family:inherit;
    line-height:1.5;
    text-align:center;
  }

  #results{display:none;}
  .error{color:var(--error);font-family:inherit;font-size:13px;font-weight:600;margin-top:12px;}

  .spec-row-diagram{
    display:flex;
    gap:34px;
    align-items:center;
  }
  .spec-row-diagram .spec-table{flex:1;min-width:0;margin-bottom:0;}

  .diagram-slot{
    flex:0 0 300px;
    width:300px;
    position:relative;
    overflow:visible;
    margin-left:32px;
    margin-top:24px;
  }
  .diagram-wrap{
    position:relative;
    flex:0 0 260px;
    width:260px;
    --dk:1; /* масштаб чертежа на экране, см. reserveDiagramOverflowScreen() */
    --lk:1; /* доп. фиксированный множитель подписей, см. renderDiagram()/labelScale в src/common-diagrams.js */
  }
  .diagram-wrap img{
    display:block;
    width:100%;
    height:auto;
  }
  .diagram-arrows{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
    pointer-events:none;
  }
  .diagram-labels{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
  }
  .diagram-label{
    position:absolute;
    transform:translate(-50%,-50%);
    background:#fff;
    border:calc(var(--dk)*var(--lk)*1px) solid var(--ink);
    color:var(--ink);
    font-family:inherit;
    font-size:calc(var(--dk)*var(--lk)*13px);
    font-weight:700;
    padding:calc(var(--dk)*var(--lk)*2px) calc(var(--dk)*var(--lk)*7px);
    border-radius:calc(var(--dk)*var(--lk)*6px);
    white-space:nowrap;
    line-height:1.3;
  }
  .diagram-label-vertical{
    transform:translate(-50%,-50%) rotate(-90deg);
  }

  /* #boardTables - явный скоуп (а не голые .spec-row-diagram/.diagram-slot/
     .diagram-wrap): те же имена классов используются и в печатной области
     (#printArea .spec-row-diagram и т.п., см. common-print.js). printBox()
     измеряет и подгоняет печатную раскладку ДО window.print() - то есть
     пока страница ещё в обычном (не print) режиме, а не в момент самой
     печати - поэтому даже "@media screen and" не спасает: пока идёт это
     измерение, узкий ЭКРАННЫЙ viewport (например, окно браузера уже
     700px - не телефон, а обычное несведённое во весь экран окно или
     масштабирование интерфейса Windows) заставлял этот !important-блок
     сработать и на печатной разметке тоже (у неё нет !important на
     flex-direction, значит она проигрывала), из-за чего чертежи в печати
     "уезжали" над таблицу и растягивались на всю ширину листа - по репорту
     пользователя. #boardTables-скоуп физически не пересекается с
     #printArea (это два разных поддерева DOM), поэтому теперь это в
     принципе невозможно, независимо от текущей ширины окна браузера. */
  @media screen and (max-width: 700px){
    #boardTables .spec-row-diagram{
      flex-direction:column;
      gap:16px !important;
    }
    #boardTables .diagram-slot{
      width:100% !important;
      flex-basis:auto !important;
    }
    /* width НЕ !important (в отличие от .diagram-slot выше) - её должен
       уметь перебить inline-стиль, который на каждый расчёт проставляет
       reserveDiagramOverflowScreen() (см. src/common-print.js), сжимая
       чертёж, если подписи/стрелки не помещаются в реальную (узкую на
       телефоне) ширину слота. С !important инлайн-сжатие никогда не
       применялось - чертёж всегда рендерился на всю ширину до 240px, и
       подписи вылезали за пределы экрана целиком - по репорту пользователя.
       100%/max-width:240px остаются как запасное значение до первого
       расчёта (пока JS ещё не отработал) и на случай, если JS-стиль вдруг
       не проставлен. */
    #boardTables .diagram-wrap{
      width:100%;
      flex-basis:auto !important;
      max-width:240px;
      margin:0 auto;
    }
  }

  /* Узкие экраны (телефоны). Фиксированные паддинги карточек и ячеек
     таблицы, рассчитанные на десктопную ширину, не сжимаются вместе с
     экраном: числовые колонки таблицы деталей (16.5% от и без того узкой
     ширины карточки) с паддингом 9-10px не оставляют места даже для
     4-значного числа при шрифте 14px - оно переносится на 2 строки.
     Внутри карточки/таблицы места объективно мало, поэтому здесь
     одновременно уменьшаем паддинг карточки и паддинг/шрифт ячеек -
     white-space:nowrap (см. выше) сам по себе только скрыл бы часть
     числа, не решив нехватку места.
     (.summary складывается в один столбец раньше, на 700px - см. блок
     выше вместе со стекингом .summary-row.) */
  @media screen and (max-width: 480px){
    .card{padding:20px;}
    .summary div{padding:14px 16px;}
    /* #boardTables - тот же повод, что и у соседнего блока (max-width:700px)
       выше: голые th/td совпадали бы и с ячейками печатной таблицы
       (#printArea .spec-table th/td) - здесь у обеих сторон нет !important,
       так что специфичность (#printArea .spec-table td сильнее голого td)
       и так защищала бы печать, но скоуп к #boardTables делает это верным
       по построению, а не по случайному стечению specificity. */
    #boardTables th, #boardTables td{padding:7px 6px;font-size:12.5px;}
    /* letter-spacing/overflow-wrap - у узких числовых колонок (16.5% от и
       без того узкой карточки) заголовки типа "ТОЛЩИНА"/"ШИРИНА" не
       умещаются в одну строку даже при уменьшенном шрифте (10px) - без
       переноса браузер не ломает слово (в русском нет пробелов внутри
       "ТОЛЩИНА"), поэтому оно просто выходило за границу своей ячейки и
       наезжало на соседний заголовок ("ТОЛЩИНАШИРИНА" слитно) - по репорту
       пользователя. overflow-wrap:break-word переносит длинное слово на
       вторую строку внутри своей же колонки вместо налезания на соседнюю.
       letter-spacing:0 убирает межбуквенный интервал (нужен только на
       просторных экранах) - экономит ещё немного ширины. */
    /* white-space:normal перебивает th.num{white-space:nowrap} (см. выше -
       правило задумано для значений вроде "1088", не для заголовков) -
       иначе оно же запрещает перенос и у самого заголовка, сводя
       overflow-wrap:break-word ни к чему (по спецификации/поведению
       браузеров nowrap отменяет любые точки переноса, включая те, что даёт
       overflow-wrap). */
    #boardTables th{font-size:10px;overflow-wrap:break-word;white-space:normal;letter-spacing:0;line-height:1.25;}
  }

  /* ============ Экран слишком узкий - только фон и надпись ============ */
  /* Ниже этой ширины интерфейс уже не удаётся показать читаемо, даже с
     переносом заголовков таблицы (см. 480px выше) - вместо сломанного вида
     показываем только фон и короткое сообщение, по просьбе пользователя.
     #tooNarrow - разметка добавлена в конец <body> отдельно в каждом
     shell.html (тип I-1/I-3/II-1), сосед .wrap, а не внутри него - скрыт по
     умолчанию, виден только через этот медиа-запрос. В печати не появляется
     в принципе - печатный <style media="print"> прячет все body>* кроме
     #printArea независимо от ширины экрана. */
  #tooNarrow{display:none;}
  @media screen and (max-width:259px){
    .wrap{display:none !important;}
    #tooNarrow{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
      text-align:center;
      color:var(--ink-soft);
      font-family:'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size:14px;
      line-height:1.5;
    }
  }

  /* ============ Фильтр толщин пиломатериала "в наличии" ============ */
  .thickness-filter{position:relative;}
  .thickness-dropdown-btn{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;

  .thickness-dropdown-panel{

    top:calc(100% + 6px);
    left:0;
    right:0;

  /* ================= ПЕЧАТЬ =================
     Печатный блок всегда отрисован (сдвинут за экран, но НЕ display:none) —
     благодаря этому перед печатью можно измерить его настоящую высоту.

     Бюджет листа А4 при полях 8 мм:
        ширина  = (210 - 16) мм = 733 px
        высота  = (297 - 16) мм = 1062 px
     Ширина — жёсткий лимит, т.к. чертёж и таблица стоят в один ряд:
        чертёж 388 + отступ 16 + зазор 20 + таблица 309 = 733
     Размеры ниже подобраны под этот бюджет: самая длинная подпись
     («Подполозная доска», «ТОЛЩИНА», «2450») помещается без обрезки.
     Оставшуюся высоту распределяет JS (см. printBox) — за счёт этого лист
     заполняется целиком, а не наполовину. */
  #printArea{
    /* Раньше прятали экстремальным сдвигом (left:-100000px) - на части
       систем (другой DPI/масштаб экрана) такой огромный offset у
       position:fixed элемента мог раздувать scrollWidth всего документа
       и визуально "растягивать" видимую страницу вбок при вызове печати
       (по репорту пользователя). opacity+pointer-events прячет элемент,
       оставляя его на обычном месте (left:0;top:0) в пределах обычного
       viewport - никакого экстремального смещения, которое могло бы
       повлиять на layout документа.
    */
    position:fixed;
    left:0;
    top:0;
    opacity:0;
    pointer-events:none;
    overflow:hidden;   /* иначе при масштабировании появляется полоса прокрутки */
  }
  /* Внутренний слой — его и масштабируем. Внешний #printArea всегда остаётся
     шириной с печатное поле, поэтому браузер не видит переполнения и не
     применяет собственное «сжать до листа» поверх нашего (из-за этого
     страница уменьшалась дважды и треть листа пустовала). */
  #printScale{ transform-origin:top left; position:relative; --pk:1; }
  #printArea, #printArea *{ box-sizing:border-box; }

  /* Водяной знак — в правом нижнем углу. Общий вид ящика - отдельная
     строка перед "Дно" (та же вёрстка .spec-row-diagram/.diagram-slot/
     .diagram-wrap, что и у остальных чертежей - размер подхватывается
     автоматически через applyDiagramWidths()), а не в шапке. Обе итоговые
     таблицы - "Внутренние размеры груза" и "Итог" - справа от него, друг
     под другом. flex:1, как у .spec-table в остальных строках, - колонка
     растягивается на всю ширину, оставшуюся после чертежа, а не жмётся
     по ширине своего текста. */
  #printArea .print-summary-col{
    display:flex;
    flex-direction:column;
    gap:calc(var(--pk)*14px);
    flex:1;
    min-width:0;
  }
  #printArea .print-watermark{
    position:absolute;right:4px;bottom:0;
    width:88px;height:auto;
    opacity:.11;
  }
  #printArea{
    background:#fff;
    font-family:'Courier New', monospace;
    color:#091135;
    font-size:16px;
    font-weight:700;
    line-height:1.4;
  }
  #printArea h1{font-size:calc(var(--pk)*24px);margin:0 0 6px;font-family:Georgia, serif;color:#8A4B26;font-weight:700;}
  #printArea .print-subtitle{color:#36394A;margin-bottom:calc(var(--pk)*6px);font-size:calc(var(--pk)*16px);font-weight:700;}

  /* Внутренние размеры груза + Итог — в колонке справа от чертежа ящика (см. .print-summary-col) */
  #printArea .print-summary-block{flex:0 0 auto;}
  #printArea .print-summary-block h2{font-size:calc(var(--pk)*12px);text-transform:uppercase;letter-spacing:.05em;color:#8A4B26;margin:0 0 6px;font-weight:700;}
  #printArea .print-plain-table{border-collapse:collapse;width:100%;}
  #printArea .print-plain-table td{padding:calc(var(--pk)*2px) 0;text-align:left;font-size:calc(var(--pk)*13px);font-weight:700;white-space:nowrap;}
  #printArea .print-plain-table td.k{color:#36394A;}
  #printArea .print-plain-table td:not(.k){width:100%;text-align:right;}

  /* Таблицы конфигурации досок.
     Ширины колонок подобраны под бюджет: «Подполозная» и «2450» влезают
     без переноса при шрифте 20px. */
  #printArea .spec-table table{width:100%;table-layout:fixed;border-collapse:collapse;margin:0;}
  #printArea .spec-table th:first-child, #printArea .spec-table td:first-child{width:48%;}
  #printArea .spec-table th:not(:first-child), #printArea .spec-table td:not(:first-child){width:13%;}
  #printArea .spec-table th, #printArea .spec-table td{
    text-align:left;padding:calc(var(--pk)*6px) calc(var(--pk)*4px);font-size:calc(var(--pk)*19px);font-weight:700;border-bottom:1px solid #E1E9F0;white-space:nowrap;overflow:hidden;
  }
  #printArea .spec-table th{color:#36394A;text-transform:uppercase;font-size:calc(var(--pk)*10px);letter-spacing:0;font-weight:700;}
  #printArea .spec-table td.num, #printArea .spec-table th.num{text-align:right;}

  #printArea .part-title{font-size:calc(var(--pk)*20px);font-weight:700;color:#8A4B26;margin:0 0 calc(var(--pk)*6px);}

  /* Секция = заголовок узла + (чертёж | таблица). Обычный блочный контейнер:
     на нём браузер надёжно соблюдает «не разрывать между листами». */
  #printArea .print-section{break-inside:avoid-page;page-break-inside:avoid;}
  #printArea .print-comment{
    font-size:calc(var(--pk)*15px);
    font-weight:700;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    border:1px solid #E1E9F0;
    border-radius:2px;
    padding:calc(var(--pk)*10px) calc(var(--pk)*12px);
  }
  #printArea .spec-row-diagram{display:flex;gap:calc(var(--pk)*16px);align-items:center;page-break-inside:avoid;margin:0;}
  #printArea .spec-row-diagram .spec-table{flex:1;min-width:0;margin:0;}
  /* 310px / отступ 26px — измеренный максимальный вылет подписей вправо и влево
     для старых (маленьких) чертежей. У Дна (2008×1212, длинная подпись у левого
     края) вылет больше — отступ увеличен до 44px; вертикальные вылеты, а также
     правый вылет подписей (пропорциональным сжатием чертежа через --dk, а не
     обрезкой) резервируются из JS (reserveDiagramOverflow). */
  #printArea .diagram-slot{flex:0 0 calc(var(--pk)*300px);width:calc(var(--pk)*300px);margin-left:calc(var(--pk)*44px);position:relative;overflow:visible;}
  /* ширина самих чертежей проставляется из JS (у них разный масштаб) */
  #printArea .diagram-wrap{position:relative;}
  #printArea .diagram-wrap img{display:block;width:100%;height:auto;}
  #printArea .diagram-arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  /* Стрелки на чертежах — при печати заметно толще, чем на экране. --dk (по
     умолчанию 1, задаётся из .diagram-wrap{--dk:1} в общем блоке выше) -
     дополнительный ПОДИАГРАММНЫЙ масштаб (в отличие от --pk, единого на всю
     страницу): его выставляет reserveDiagramOverflow() в src/common-print.js,
     когда конкретному чертежу требуется сжатие, чтобы вылетающие за картинку
     подписи (см. reserveDiagramOverflow) не налезали на соседнюю таблицу. */
  #printArea .diagram-arrows line{stroke-width:calc(var(--pk)*var(--dk)*3px) !important;}
  #printArea .diagram-labels{position:absolute;inset:0;pointer-events:none;}
  #printArea .diagram-label{
    position:absolute;transform:translate(-50%,-50%);background:#fff;
    border:calc(var(--pk)*var(--dk)*var(--lk,1)*2px) solid #8A4B26;color:#091135;font-size:calc(var(--pk)*var(--dk)*var(--lk,1)*15px);font-weight:700;
    padding:calc(var(--pk)*var(--dk)*var(--lk,1)*2px) calc(var(--pk)*var(--dk)*var(--lk,1)*6px);white-space:nowrap;line-height:1.3;
  }
  #printArea .diagram-label-vertical{
    transform:translate(-50%,-50%) rotate(-90deg);
  }

</style>
<style>

<div class="wrap">

<script>
// Каталог ГОСТов для стартовой страницы (уровень 1).
//
// Чтобы добавить новый ГОСТ - добавьте запись сюда (file - страница со списком
// типов этого ГОСТа, см. src/launcher/types-*.js и build.py: TYPES_PAGES) и
// пересоберите (python3 build.py).
const GOSTS = [
  {
    gost: 'ГОСТ 10198-91',
    title: 'Ящики дощатые неразборные для грузов массой до 3000 кг',
    file: 'gost-10198-91.html'
  }
  // Следующий ГОСТ добавляется сюда новым объектом { gost, title, file }.
];


(function(){
  const root = document.getElementById('gosts');
  if(!GOSTS.length){
    root.innerHTML = '<div class="card"><span class="empty-note">ГОСТы ещё не добавлены.</span></div>';
    return;
  }
  let html = '<div class="gost-list">';
  GOSTS.forEach(g => {
    html += `<a class="gost-link" href="${g.file}">
      <div class="gost-name">${g.gost}</div>
      <span class="arrow">→</span>
    </a>`;
  });
  html += '</div>';
  root.innerHTML = html;
})();
</script>
</body>
</html>
