<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Палитра и токены — "бумажная обсерватория" (см. превью-артефакт,
       одобренный пользователем): почти ахроматичный холст + два оттенка
       коричневого вместо синих акцентов референса. --accent (Umber) -
       ТОЛЬКО заливка основной кнопки/CTA; --accent2 (Amber) - все остальные
       акцентные касания (фокус, ссылки, чекбоксы, hover-обводки, eyebrow) -
       та же роль, что у Cobalt Surface/Electric Blue в референсе. Тени
       убраны везде (--shadow-sm/--shadow-lg = none) - элевация через
       обводки-волоски и тонировку фона, не через box-shadow.
       Text/border palette (Midnight Ink/Slate/Frost Border) - как в самом
       референсе, без изменений (правки пользователя касались только фонов и
       синих акцентов, не текста/обводок). */
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --panel-hover: #FAF6EF;
    --table-header-bg: #F6F0E6;
    --ink: #091135;
    --ink-soft: #36394A;
    --rule: #E1E9F0;
    --border-input: #E1E9F0;
    --border-btn: #E1E9F0;
    --secondary-hover: #F6F0E6;
    --accent: #8A4B26;
    --accent-hover: #6E3B1C;
    --accent2: #C97E3B;
    --accent-wash: #F1E4D8;
    --ok: #2E7D32;
    --warn: #B7791F;
    --warn-wash: #FBF3E4;
    --error: #c23b2c;
    --shadow-sm: none;
    --shadow-lg: none;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:16px;
    letter-spacing:.015em;
    line-height:1.35;
    overflow-x:hidden;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}

  /* Навигация «Назад» / «Главная» - вверху страниц выбора ГОСТа/типа и самих
     калькуляторов (везде, кроме самой стартовой страницы - там некуда). */
  .top-nav{
    display:flex;
    gap:16px;
    margin-bottom:20px;
  }
  .top-nav a{
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .top-nav a:hover{color:var(--accent2);}

  header{
    border-bottom:1px solid var(--rule);
    padding-bottom:20px;
    margin-bottom:32px;
  }
  .eyebrow{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent2);
    margin-bottom:8px;
  }
  h1{
    font-size:30px;
    margin:0 0 6px;
    color:var(--ink);
    font-weight:600;
  }
  .subtitle{
    font-size:14px;
    color:var(--ink-soft);
    font-family:inherit;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:32px;
    margin-bottom:24px;
    box-shadow:var(--shadow-sm);
  }
  .card h2{
    font-size:16px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink);
    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--rule);
  }

  .inputs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  /* "screen and" на всех адаптивных breakpoint'ах ниже (640/700/480px) -
     без него эти правила совпадали бы с теми же именами классов и внутри
     печатной области (#printArea .spec-row-diagram и т.п. используют те
     же общие имена классов, что и экранная вёрстка) - ширина печатного
     листа A4 (~733px по расчёту в common-print.js) достаточно близка к
     700px, и на части систем (другая трактовка @page margin/DPI при
     печати) реально может просесть ниже порога, из-за чего чертежи в
     печати непредсказуемо переключались на мобильную раскладку (в столбец,
     на всю ширину листа) - по репорту пользователя. */
  @media screen and (max-width:640px){
    .inputs{grid-template-columns:repeat(2,1fr);}
  }
  label{
    display:block;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type=number]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border-input);
    border-radius:8px;
    font-family:inherit;
    font-size:16px;
    background:#ffffff;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input[type=number]:focus{
    outline:2px solid var(--accent2);
    outline-offset:2px;
    border-color:var(--accent2);
  }
  select{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border-input);
    border-radius:8px;
    font-family:inherit;
    font-size:16px;
    background:#ffffff;
    color:var(--ink);
  }
  select:focus{
    outline:2px solid var(--accent2);
    outline-offset:2px;
    border-color:var(--accent2);
  }

  .comment-field{
    width:100%;
    min-height:110px;
    padding:14px 16px;
    border:1px solid var(--border-input);
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
    line-height:1.5;
    background:#ffffff;
    color:var(--ink);
    resize:vertical;
    box-sizing:border-box;
  }
  .comment-field:focus{
    outline:2px solid var(--accent2);
    outline-offset:2px;
    border-color:var(--accent2);
  }
  .comment-field::placeholder{
    color:var(--ink-soft);
  }

  button{
    margin-top:20px;
    background:var(--accent);
    color:#ffffff;
    border:none;
    padding:12px 24px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.015em;
    cursor:pointer;
    border-radius:8px;
    box-shadow:var(--shadow-sm);
    transition:background-color .15s ease;
  }
  button:hover{background:var(--accent-hover);}
  .action-card button:first-child{margin-top:0;}

  /* Secondary — второстепенные действия (см. design.md: белая, рамка, hover-фон) */
  .btn-secondary{
    background:#ffffff;
    color:var(--ink);
    border:1px solid var(--border-btn);
    box-shadow:none;
  }
  .btn-secondary:hover{background:var(--secondary-hover);}

  .calc-outdated{
    display:none;
    align-items:center;
    margin-left:14px;
    color:var(--warn);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    vertical-align:middle;
  }

  .calc-check{
    display:none;
    align-items:center;
    margin-left:14px;
    color:var(--ok);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    vertical-align:middle;
  }
  .calc-check .mark{
    display:inline-block;
    width:20px;height:20px;
    line-height:20px;
    text-align:center;
    border-radius:50%;
    background:var(--ok);
    color:#fff;
    font-weight:700;
    margin-right:6px;
  }

  .print-btn{
    margin-top:20px;
    margin-left:12px;
    padding:12px 22px;
    font-size:13px;
  }

  .summary-row{
    display:flex;
    gap:24px;
    align-items:center;
  }
  .summary-row .summary{flex:1;min-width:0;}
  .box-view{
    flex:0 0 280px;
    width:280px;
    height:auto;
    display:block;
    border:1px solid var(--rule);
    border-radius:12px;
    background:var(--panel);
    padding:12px;
    box-shadow:var(--shadow-sm);
  }
  @media screen and (max-width:700px){
    .summary-row{flex-direction:column;align-items:stretch;}
    .box-view{flex-basis:auto;width:100%;max-width:280px;margin:0 auto;}
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
    border-radius:12px;
    overflow:hidden;
  }
  .summary div{background:var(--panel);padding:18px 16px;}
  .summary .label{
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .summary .value{
    font-size:24px;
    font-weight:700;
    color:var(--ink);
    font-family:inherit;
  }
  .summary .value span{font-size:13px;font-weight:400;color:var(--ink-soft);}

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    margin-bottom:8px;
  }

     благодаря этому перед печатью можно измерить его настоящую высоту.

     Бюджет листа А4 при полях 8 мм:
        ширина  = (210 - 16) мм = 733 px
        высота  = (297 - 16) мм = 1062 px
     Ширина — жёсткий лимит, т.к. чертёж и таблица стоят в один ряд:
        чертёж 388 + отступ 16 + зазор 20 + таблица 309 = 733
     Размеры ниже подобраны под этот бюджет: самая длинная подпись
     («Подполозная доска», «ТОЛЩИНА», «2450») помещается без обрезки.
     Оставшуюся высоту распределяет JS (см. printBox) — за счёт этого лист
     заполняется целиком, а не наполовину. */
  #printArea{

       систем (другой DPI/масштаб экрана) такой огромный offset у
       position:fixed элемента мог раздувать scrollWidth всего документа
       и визуально "растягивать" видимую страницу вбок при вызове печати
       (по репорту пользователя). opacity+pointer-events прячет элемент,
       оставляя его на обычном месте (left:0;top:0) в пределах обычного
       viewport - никакого экстремального смещения, которое могло бы
       повлиять на layout документа.

    position:fixed;
    left:0;
    top:0;
    opacity:0;

     применяет собственное «сжать до листа» поверх нашего (из-за этого

  #printArea .print-section{break-inside:avoid-page;page-break-inside:avoid;}

(function(){
  // Тип, у которого способ крепления груза переключается внутри калькулятора
  // (см. switchFastening/applyStateFromUrl в src/app.js), должен вести на тот
  // файл, что был выбран в последний раз - иначе после переключения там
  // человек снова попадал бы на файл по умолчанию при следующем заходе через
  // список типов. Ключ localStorage - тот же FASTENING_STORAGE_KEY, что и в
  // самом калькуляторе, значения оттуда же (fasteningFiles).
  const FASTENING_STORAGE_KEY = 'silvan-gost10198-t1-k3-fastening-type';
  function resolveFile(t){
    if(!t.fasteningFiles) return t.file;
    let saved = null;
    try{ saved = localStorage.getItem(FASTENING_STORAGE_KEY); }catch(e){}
    return (saved && t.fasteningFiles[saved]) || t.file;
  }

  const root = document.getElementById('types');
  let html = '';
  TYPES.forEach(t => {
    const badgeClass = 'type-badge' + (t.badgeDanger ? ' type-badge-danger' : t.badgeOk ? ' type-badge-ok' : '');
    const badge = t.badge ? `<span class="${badgeClass}">${t.badge}</span>` : '';
    html += `<a class="type-card" href="${resolveFile(t)}">
      ${badge}
      <div class="type-info"><h3>${t.name}</h3></div>
      <div class="type-image"><img src="${t.image}" alt="${t.name}"></div>
    </a>`;
  });
  root.innerHTML = html;
})();
</script>
