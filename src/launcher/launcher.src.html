<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тара+ - калькуляторы тары</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__IMG:favicon.png__">
<style>/*__FONTS_CSS__*/</style>
<style>
/*__STYLE_CSS__*/
  /* Наведение (вариант D, по выбору пользователя): тёплый фон, мягкая
     коричневая рамка, название сдвигается на 4 px, стрелка появляется (на
     устройствах без наведения - видна всегда). */
  .gost-link .gost-name{transition:transform .2s ease;}
  .gost-link .arrow{transition:opacity .2s ease, transform .2s ease;}
  .gost-link:not(.gost-link-off):hover, .gost-link:focus-visible{
    border-color:color-mix(in srgb, var(--accent) 40%, var(--border-input));
    background:var(--panel-hover);
  }
  .gost-link:not(.gost-link-off):hover .gost-name, .gost-link:focus-visible .gost-name{transform:translateX(4px);}
  @media (hover:hover){
    .gost-link .arrow{opacity:0;}
    .gost-link:hover .arrow, .gost-link:focus-visible .arrow{opacity:1;transform:translateX(4px);}
  }
  @media (prefers-reduced-motion:reduce){
    .gost-link .gost-name, .gost-link .arrow{transition:none;}
    .gost-link:hover .gost-name, .gost-link:focus-visible .gost-name,
    .gost-link:hover .arrow, .gost-link:focus-visible .arrow{transform:none;}
  }
</style>
<script>
/*__COMMON_SETTINGS_JS__*/
</script>
<style>
  /* Стили стартовой страницы (уровень 1 - список ГОСТов) - поверх общего
     style.css, специфика только здесь. */
  .gost-list{display:flex;flex-direction:column;gap:16px;}
  .gost-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    border:1px solid var(--border-input);
    border-radius:10px;
    background:var(--panel);
    color:var(--ink);
    text-decoration:none;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .gost-link .gost-name{font-size:16px;font-weight:600;}
  /* ГОСТ в работе (по указанию пользователя): карточка не нажимается, без
     стрелки и без подсветки, красная плашка - как у типов (.type-badge). */
  .gost-link{position:relative;}
  .gost-link-off{cursor:default;}
  .gost-link-off:hover{border-color:var(--border-input);background:var(--panel);}
  .gost-badge{
    position:absolute;
    top:-10px;
    right:16px;
    padding:4px 12px;
    border-radius:999px;
    background:var(--error);
    color:#ffffff;
    font-size:12px;
    font-weight:600;
    line-height:1.4;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    pointer-events:none;
  }
  .gost-link .arrow{color:var(--accent);font-size:18px;line-height:1;flex:none;}
  .empty-note{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Калькуляторы производства тары</h1>
    <div class="subtitle">Выберите ГОСТ</div>
  </header>

  <div id="gosts"></div>
</div>

<script>
/*__GOSTS_JS__*/

(function(){
  const root = document.getElementById('gosts');
  if(!GOSTS.length){
    root.innerHTML = '<div class="card"><span class="empty-note">ГОСТы ещё не добавлены.</span></div>';
    return;
  }
  let html = '<div class="gost-list">';
  GOSTS.forEach(g => {
    const badge = g.badge ? `<span class="gost-badge">${g.badge}</span>` : '';
    // Без file - ГОСТ в работе: карточка не ссылка.
    if(!g.file){
      html += `<div class="gost-link gost-link-off" aria-disabled="true">${badge}<div class="gost-name">${g.gost}</div></div>`;
      return;
    }
    html += `<a class="gost-link" href="${g.file}">
      ${badge}<div class="gost-name">${g.gost}</div>
      <span class="arrow">→</span>
    </a>`;
  });
  html += '</div>';
  root.innerHTML = html;
})();
</script>
</body>
</html>
