<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOODCALC — калькуляторы тары</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__STYLE_CSS__*/
</style>
<style>
  /* Стили стартовой страницы (уровень 1 - список ГОСТов) - поверх общего
     style.css, специфика только здесь. */
  .wrap{max-width:760px;}
  .gost-list{display:flex;flex-direction:column;gap:10px;}
  .gost-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    border:1px solid var(--border-input);
    border-radius:10px;
    background:#ffffff;
    color:var(--ink);
    text-decoration:none;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .gost-link:hover{
    border-color:var(--accent);
    background:var(--accent-wash);
  }
  .gost-link .gost-name{font-size:16px;font-weight:600;}
  .gost-link .gost-title{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .gost-link .arrow{color:var(--accent);font-size:18px;line-height:1;flex:none;}
  .empty-note{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">WOODCALC</div>
    <h1>Калькуляторы производства тары</h1>
    <div class="subtitle">Выберите ГОСТ, затем тип тары</div>
  </header>

  <div id="gosts"></div>
</div>

<script>
/*__GOSTS_JS__*/

(function(){
  const root = document.getElementById('gosts');
  if(!GOSTS.length){
    root.innerHTML = '<div class="card"><span class="empty-note">ГОСТы ещё не добавлены.</span></div>';
    return;
  }
  let html = '<div class="gost-list">';
  GOSTS.forEach(g => {
    html += `<a class="gost-link" href="${g.file}">
      <div><div class="gost-name">${g.gost}</div><div class="gost-title">${g.title}</div></div>
      <span class="arrow">→</span>
    </a>`;
  });
  html += '</div>';
  root.innerHTML = html;
})();
</script>
</body>
</html>
