<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOODCALC — калькуляторы тары</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__STYLE_CSS__*/
</style>
<style>
  /* Стили стартовой страницы - поверх общего style.css, специфика только
     здесь (карточки-группы по ГОСТам, список ссылок на калькуляторы). */
  .wrap{max-width:760px;}
  .gost-desc{
    font-size:14px;
    color:var(--ink-soft);
    margin:-8px 0 20px;
  }
  .calc-list{display:flex;flex-direction:column;gap:10px;}
  .calc-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border:1px solid var(--border-input);
    border-radius:10px;
    background:#ffffff;
    color:var(--ink);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .calc-link:hover{
    border-color:var(--accent);
    background:var(--accent-wash);
  }
  .calc-link .arrow{
    color:var(--accent);
    font-size:18px;
    line-height:1;
  }
  .empty-note{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">WOODCALC</div>
    <h1>Калькуляторы производства тары</h1>
    <div class="subtitle">Выберите ГОСТ и тип тары для расчёта</div>
  </header>

  <div id="catalog"></div>
</div>

<script>
/*__CATALOG_JS__*/

(function(){
  const root = document.getElementById('catalog');
  if(!CATALOG.length){
    root.innerHTML = '<div class="card"><span class="empty-note">Калькуляторы ещё не добавлены.</span></div>';
    return;
  }
  let html = '';
  CATALOG.forEach(group => {
    html += `<div class="card">
      <h2>${group.gost}</h2>
      <div class="gost-desc">${group.title}</div>
      <div class="calc-list">`;
    group.items.forEach(item => {
      html += `<a class="calc-link" href="${item.file}"><span>${item.name}</span><span class="arrow">→</span></a>`;
    });
    html += `</div></div>`;
  });
  root.innerHTML = html;
})();
</script>
</body>
</html>
