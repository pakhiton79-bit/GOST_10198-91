<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/*__GOST_NAME__*/ — WOODCALC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__STYLE_CSS__*/
</style>
<style>
  /* Стили страницы выбора типа - поверх общего style.css. */
  .wrap{max-width:820px;}
  .back-link{
    display:inline-block;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:16px;
  }
  .back-link:hover{color:var(--accent);}
  .type-card{
    display:flex;
    align-items:center;
    gap:24px;
    padding:20px;
    border:1px solid var(--border-input);
    border-radius:12px;
    background:#ffffff;
    text-decoration:none;
    color:var(--ink);
    margin-bottom:16px;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .type-card:hover{
    border-color:var(--accent);
    background:var(--accent-wash);
  }
  .type-info{flex:1;min-width:0;}
  .type-info h3{
    font-size:18px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .type-info p{
    font-size:14px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.45;
  }
  .type-image{
    flex:0 0 160px;
    width:160px;
    height:120px;
    border-radius:8px;
    border:1px solid var(--border-input);
    overflow:hidden;
    background:#ffffff;
  }
  .type-image img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }
  @media (max-width:560px){
    .type-card{flex-direction:column;align-items:stretch;}
    .type-image{width:100%;flex-basis:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Все ГОСТы</a>
  <header>
    <div class="eyebrow">/*__GOST_NAME__*/</div>
    <h1>/*__GOST_TITLE__*/</h1>
    <div class="subtitle">Выберите тип тары для расчёта</div>
  </header>

  <div id="types"></div>
</div>

<script>
/*__TYPES_JS__*/

(function(){
  const root = document.getElementById('types');
  let html = '';
  TYPES.forEach(t => {
    html += `<a class="type-card" href="${t.file}">
      <div class="type-info"><h3>${t.name}</h3><p>${t.desc}</p></div>
      <div class="type-image"><img src="${t.image}" alt="${t.name}"></div>
    </a>`;
  });
  root.innerHTML = html;
})();
</script>
</body>
</html>
